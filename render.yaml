services:
  - type: web
    name: jk-mart
    runtime: docker
    plan: free
    dockerfilePath: "./JK Mart/Dockerfile"
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jkmart-db
          property: connectionString

databases:
  - name: jkmart-db
    databaseName: jkmart
    user: jkmart
    plan: free
